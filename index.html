function Btn({children,onClick,v,size,disabled,fw,style}){
  const V=v||"primary";const S=size||"md";
  const BG={primary:"linear-gradient(135deg,#FFB800,#FF8C00)",danger:"linear-gradient(135deg,#ef4444,#f97316)",success:"linear-gradient(135deg,#10b981,#059669)",ghost:"transparent",soft:"rgba(255,184,0,.15)",white:"rgba(255,255,255,.15)"};
  const FG={primary:"#fff",danger:"#fff",success:"#fff",ghost:"#FFB800",soft:"#FFB800",white:"#fff"};
  const BD={ghost:"1.5px solid #FFB800",white:"1.5px solid rgba(255,255,255,.4)"};
  const PD={sm:"6px 12px",md:"10px 20px",lg:"13px 28px"};
  return <button onClick={onClick} disabled={disabled} style={{background:BG[V]||BG.primary,color:FG[V]||"#fff",border:BD[V]||"none",padding:PD[S]||PD.md,borderRadius:10,cursor:disabled?"not-allowed":"pointer",fontSize:S==="sm"?12:14,fontWeight:700,opacity:disabled?.5:1,transition:"all .15s",width:fw?"100%":undefined,fontFamily:"inherit",...style}}
    onMouseEnter={e=>{if(!disabled){e.currentTarget.style.opacity=".88";e.currentTarget.style.transform="translateY(-1px)";}}}
    onMouseLeave={e=>{e.currentTarget.style.opacity="1";e.currentTarget.style.transform="";}}>
    {children}
  </button>;
}


function Card({children,style,onClick}){

function Pill({children,color}){

  const savePost=()=>{if(!pf.title.trim()&&!pf.content.trim()&&!pf.images.length&&!pf.fileData)return;setData({...data,posts:[...data.posts,{id:gid(),classId,type:postModal,title:pf.title.trim()||pf.content.slice(0,40)||"📎",content:pf.content,url:pf.url||(postModal==="material"?"":pf.url),images:pf.images||[],materialType:pf.materialType,fileData:pf.fileData,fileName:pf.fileName,authorId:"t1",createdAt:Date.now(),likes:[]}]});setPostModal(null);setPf({title:"",content:"",url:"",fileData:null,fileName:"",materialType:"link",images:[]});show("发布成功");};
  const saveLink=()=>{setData({...data,classes:data.classes.map(c=>c.id===classId?{...c,classLink:newLink,linkUpdatedAt:Date.now()}:c)});setLinkModal(false);show("链接已更新");};

  const handleImgs=async(files)=>{if(!files||!files.length)return;const avail=5-(pf.images.length);if(avail<=0){show("最多5张","warn");return;}setImgLoading(true);const imgs=[];for(const f of Array.from(files).slice(0,avail)){try{imgs.push(await resizeImg(f));}catch{}}setPf(prev=>({...prev,images:[...prev.images,...imgs]}));setImgLoading(false);};
  const handleFile=(file,type)=>{const r=new FileReader();r.onload=e=>setPf(prev=>({...prev,fileData:e.target.result,fileName:file.name,materialType:type}));r.readAsDataURL(file);};
  
  
  const ts=id=>({padding:"9px 14px",border:"none",background:"transparent",cursor:"pointer",fontWeight:tabId===id?700:400,color:tabId===id?"#FFB800":sc,fontSize:13,fontFamily:"inherit",borderBottom:tabId===id?"2.5px solid #FFB800":"2.5px solid transparent",transition:"all .15s",whiteSpace:"nowrap"});

    <div style={{borderRadius:16,overflow:"hidden",marginBottom:16,boxShadow:dk?"0 4px 16px rgba(0,0,0,.3)":"0 4px 16px rgba(0,0,0,.08)"}}>
      <div style={{background:"linear-gradient(135deg,"+pal[0]+","+pal[1]+")",padding:"20px"}}>
        <h2 style={{margin:"0 0 4px",fontSize:20,fontWeight:800,color:"#fff"}}>{cls.name}</h2>
        {cls.desc&&<div style={{fontSize:13,color:"rgba(255,255,255,.8)",marginBottom:10}}>{cls.desc}</div>}
        {cls.classLink?<div style={{background:"rgba(255,255,255,.18)",borderRadius:10,padding:"9px 13px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <div><div style={{fontSize:10,color:"rgba(255,255,255,.7)",marginBottom:2}}>📌 上课链接</div><div style={{fontSize:13,color:"#fff",wordBreak:"break-all"}}>{cls.classLink}</div></div>
          <div style={{display:"flex",gap:6,flexShrink:0}}>
            <Btn v="white" size="sm" onClick={()=>window.open(cls.classLink,"_blank")}>{lang==="en"?"Open":"打开"}</Btn>
            <Btn v="white" size="sm" onClick={()=>{try{navigator.clipboard.writeText(cls.classLink).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000)});}catch{}}}>{copied?"已复制":"复制"}</Btn>
            <Btn v="white" size="sm" onClick={()=>setLinkModal(true)}>✎</Btn>
          </div>
        </div>:<Btn v="white" size="sm" onClick={()=>setLinkModal(true)}>+ 设置上课链接</Btn>}
      </div>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
      <Btn v="primary" size="sm" onClick={()=>{setPostModal("material");setPf({title:"",content:"",url:"",fileData:null,fileName:"",materialType:"link",images:[]});}}>📎 发布教材</Btn>
      <Btn v="soft" size="sm" onClick={()=>{setPostModal("announcement");setPf({title:"",content:"",url:"",fileData:null,fileName:"",materialType:"link",images:[]});}}>📢 发布通告</Btn>
      <Btn v="ghost" size="sm" onClick={()=>setLinkModal(true)}>🔗 更新链接</Btn>

    </div>
    <div style={{display:"flex",borderBottom:"1px solid "+(dk?"rgba(255,255,255,.06)":"rgba(0,0,0,.06)"),marginBottom:14,overflowX:"auto"}}>
      <button style={ts("feed")} onClick={()=>setTabId("feed")}>📋 教材通告 ({feed.length})</button>
      <button style={ts("forum")} onClick={()=>setTabId("forum")}>💬 论坛 ({forum.length})</button>
      <button style={ts("badges")} onClick={()=>setTabId("badges")}>徽章 ({classBadges.length})</button>
      <button style={ts("members")} onClick={()=>setTabId("members")}>👥 学员 ({enrolled.length})</button>
    </div>
    {tabId==="feed"&&<div>{feed.length===0&&<p style={{color:sc,textAlign:"center",padding:"36px 0"}}>{lang==="en"?"No content yet":"暂无内容"}</p>}{feed.map(post=><PostCard key={post.id} post={post} isTeacher userId="t1" onDelete={()=>setCfDelP(post.id)} show={show}/>)}</div>}
    {tabId==="forum"&&<div><div style={{marginBottom:12}}><Btn v="soft" size="sm" onClick={()=>{setPostModal("forum");setPf({title:"",content:"",url:"",fileData:null,fileName:"",materialType:"link",images:[]});}}>+ 发帖</Btn></div>{forum.length===0&&<p style={{color:sc,textAlign:"center",padding:"36px 0"}}>{lang==="en"?"No posts yet":"暂无帖子"}</p>}{forum.map(post=><PostCard key={post.id} post={post} isTeacher userId="t1" onDelete={()=>setCfDelP(post.id)} show={show}/>)}</div>}
    {tabId==="badges"&&<ClassBadgesPanel classId={classId} show={show}/>}
    {tabId==="members"&&<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><span style={{fontWeight:700,fontSize:14,color:tc}}>👥 {enrolled.length} 位学员</span><Btn v="primary" size="sm" onClick={()=>setAddStuOpen(true)}>+ 加入学员</Btn></div>
      {enrolled.map(s=><Card key={s.id} style={{padding:"11px 14px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",gap:10,alignItems:"center"}}><span style={{fontSize:22}}>{s.avatar}</span><div><div style={{fontWeight:700,fontSize:13,color:tc}}>{s.name}</div><div style={{fontSize:11,color:sc}}>@{s.username}</div></div></div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <Pill color={s.feesPaid?"green":"red"}>{s.feesPaid?"已缴费":"未缴费"}</Pill>
          <Btn v="danger" size="sm" onClick={()=>setData({...data,users:data.users.map(u=>u.id===s.id?{...u,enrolledClasses:(u.enrolledClasses||[]).filter(c=>c!==classId)}:u)})}>移出</Btn>
        </div>
      </Card>)}
      {enrolled.length===0&&<p style={{color:sc,textAlign:"center",padding:"36px 0"}}>暂无学员</p>}
    </div>}
    <Modal open={!!postModal} title={postModal==="material"?"发布教材":postModal==="announcement"?"发布通告":"发帖"} onClose={()=>setPostModal(null)} wide>
      <Inp label="标题（选填）" value={pf.title} onChange={v=>setPf(f=>({...f,title:v}))} placeholder="输入标题..."/>
      <Txt label="内容" value={pf.content} onChange={v=>setPf(f=>({...f,content:v}))} rows={4} placeholder="输入内容..."/>
      {postModal==="material"&&<div style={{marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:700,marginBottom:8,textTransform:"uppercase",letterSpacing:.5,color:sc}}>上传类型</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
          {[["link","🔗 链接"],["image","🖼️ 图片"],["pdf","📄 PDF"],["video","🎬 视频"]].map(([val,lb])=><button key={val} onClick={()=>setPf(f=>({...f,materialType:val,fileData:null,fileName:""}))} style={{padding:"6px 12px",borderRadius:8,border:"1.5px solid "+(pf.materialType===val?"#FFB800":"rgba(0,0,0,.15)"),background:pf.materialType===val?"rgba(255,184,0,.15)":"transparent",color:pf.materialType===val?"#FFB800":sc,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit"}}>{lb}</button>)}
        </div>
        {pf.materialType==="image"&&<React.Fragment><input type="file" accept="image/*" id="mat-img" style={{display:"none"}} onChange={e=>{if(e.target.files[0])handleFile(e.target.files[0],"image");e.target.value="";}}/><label htmlFor="mat-img"><span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"8px 14px",borderRadius:9,border:"1.5px dashed #6366f1",background:"rgba(255,184,0,.08)",cursor:"pointer",fontSize:13,color:"#FFB800",fontWeight:600}}>🖼️ 选择图片</span></label></React.Fragment>}
        {pf.materialType==="pdf"&&<React.Fragment><input type="file" accept=".pdf" id="mat-pdf" style={{display:"none"}} onChange={e=>{if(e.target.files[0])handleFile(e.target.files[0],"pdf");e.target.value="";}}/><label htmlFor="mat-pdf"><span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"8px 14px",borderRadius:9,border:"1.5px dashed #6366f1",background:"rgba(255,184,0,.08)",cursor:"pointer",fontSize:13,color:"#FFB800",fontWeight:600}}>📄 选择PDF</span></label></React.Fragment>}
        {pf.fileData&&<div style={{marginTop:8,padding:"8px 12px",borderRadius:8,background:"rgba(99,102,241,.07)",display:"flex",gap:8,alignItems:"center"}}><span>📎</span><span style={{flex:1,fontSize:12,color:tc,wordBreak:"break-all"}}>{pf.fileName}</span><button onClick={()=>setPf(f=>({...f,fileData:null,fileName:""}))} style={{background:"none",border:"none",cursor:"pointer",color:"#ef4444",fontSize:13}}>✕</button></div>}
        {(pf.materialType==="link"||pf.materialType==="video")&&<Inp label="链接地址" value={pf.url} onChange={v=>setPf(f=>({...f,url:v}))} placeholder="https://..."/>}
      </div>}
      {postModal==="forum"&&<div style={{marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:700,marginBottom:6,textTransform:"uppercase",letterSpacing:.5,color:sc}}>图片（选填，最多5张）</div>
        <input type="file" accept="image/*" multiple id="post-imgs" style={{display:"none"}} onChange={e=>{handleImgs(e.target.files);e.target.value="";}}/>
        <label htmlFor="post-imgs"><span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"7px 14px",borderRadius:9,border:"1.5px dashed #6366f1",background:"rgba(255,184,0,.08)",cursor:"pointer",fontSize:13,color:imgLoading?"#94a3b8":"#FFB800",fontWeight:600}}>{imgLoading?"⏳ 处理中...":"🖼️ 添加图片"} ({pf.images.length}/5)</span></label>
        {pf.images.length>0&&<div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:8}}>{pf.images.map((img,i)=><div key={i} style={{position:"relative",width:68,height:68}}><img src={img} style={{width:68,height:68,objectFit:"cover",borderRadius:8,display:"block"}}/><button onClick={()=>setPf(f=>({...f,images:f.images.filter((_,j)=>j!==i)}))} style={{position:"absolute",top:-6,right:-6,background:"#ef4444",border:"none",color:"#fff",width:18,height:18,borderRadius:"50%",cursor:"pointer",fontSize:10}}>✕</button></div>)}</div>}
        <Inp label="附件链接（选填）" value={pf.url} onChange={v=>setPf(f=>({...f,url:v}))} placeholder="https://..." style={{marginTop:8}}/>
      </div>}
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><Btn v="ghost" onClick={()=>setPostModal(null)}>取消</Btn><Btn onClick={savePost}>发布</Btn></div>
    </Modal>
    <Modal open={linkModal} title="更新上课链接" onClose={()=>setLinkModal(false)}>
      <Inp label="链接地址" value={newLink} onChange={setNewLink} placeholder="https://zoom.us/j/..."/>
      <p style={{fontSize:12,color:sc,margin:"0 0 14px"}}>更新后学生将看到提醒通知</p>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><Btn v="ghost" onClick={()=>setLinkModal(false)}>取消</Btn><Btn onClick={saveLink}>保存</Btn></div>
    </Modal>
    <Modal open={clsModal} title="班级设置" onClose={()=>setClsModal(false)}>
      <div style={{marginBottom:16}}>
        <div style={{fontSize:11,fontWeight:700,marginBottom:10,textTransform:"uppercase",letterSpacing:.5,color:sc}}>班级颜色</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {PALS.map((pal2,idx)=><button key={idx} onClick={()=>setColorIdx(idx)} style={{width:26,height:26,borderRadius:7,background:"linear-gradient(135deg,"+pal2[0]+","+pal2[1]+")",border:"3px solid "+(colorIdx===idx?"#fff":"transparent"),outline:colorIdx===idx?"2px solid "+pal2[0]:"none",cursor:"pointer",padding:0}}/>)}
        </div>
      </div>
      <div style={{marginBottom:16}}>
        <div style={{fontSize:11,fontWeight:700,marginBottom:8,textTransform:"uppercase",letterSpacing:.5,color:sc}}>💰 课程月费</div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{color:sc,fontSize:16}}>¥</span>
          <input type="number" value={feeInput} onChange={e=>setFeeInput(e.target.value)} min="0" placeholder="0"
            style={{flex:1,padding:"10px 13px",borderRadius:10,border:"1.5px solid "+(dk?"rgba(255,255,255,.1)":"rgba(0,0,0,.1)"),background:dk?"rgba(255,255,255,.05)":"rgba(0,0,0,.02)",color:dk?"#f1f5f9":"#0f172a",fontSize:14,outline:"none",fontFamily:"inherit"}}/>
          <span style={{color:sc,fontSize:13}}>/月</span>
        </div>
        <p style={{fontSize:11,color:sc,marginTop:5}}>学生缴费界面将显示此费用</p>
      </div>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><Btn v="ghost" onClick={()=>setClsModal(false)}>取消</Btn><Btn onClick={saveCls}>保存</Btn></div>
    </Modal>
    {addStuOpen&&<AddStuModal classId={classId} onClose={()=>setAddStuOpen(false)} show={show}/>}
    {cfDelP&&<ConfirmDlg msg="删除这条内容？" onOk={()=>delPost(cfDelP)} onNo={()=>setCfDelP(null)}/>}
  </div>;
}



function AddStuModal({classId,onClose,show}){
  const {theme,data,setData}=useApp();const dk=theme==="dark";const tc=dk?"#f1f5f9":"#0f172a";const sc=dk?"#64748b":"#94a3b8";
  const [sel,setSel]=useState([]);
  const notIn=data.users.filter(u=>u.role==="student"&&!(u.enrolledClasses||[]).includes(classId));
  const doAdd=()=>{if(!sel.length)return;setData({...data,users:data.users.map(u=>sel.includes(u.id)?{...u,enrolledClasses:[...(u.enrolledClasses||[]),classId]}:u)});show(sel.length+" 位学员已加入");onClose();};
  return <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:"fixed",inset:0,zIndex:9100,display:"flex",alignItems:"center",justifyContent:"center",padding:16,background:"rgba(0,0,0,.55)",backdropFilter:"blur(8px)"}}>
    <div style={{width:"100%",maxWidth:400,background:dk?"#1e293b":"#fff",borderRadius:20,overflow:"hidden",boxShadow:"0 24px 60px rgba(0,0,0,.35)",animation:"mPop .2s ease"}}>
      <div style={{padding:"18px 20px 12px",borderBottom:"1px solid "+(dk?"rgba(255,255,255,.05)":"rgba(0,0,0,.06)")}}>
        <h3 style={{margin:0,fontSize:16,fontWeight:700,color:tc}}>选择要加入的学员</h3>
      </div>
      <div style={{maxHeight:320,overflowY:"auto",padding:"10px 12px"}}>
        {notIn.length===0&&<p style={{color:sc,textAlign:"center",padding:"24px"}}>所有学员已加入此班</p>}
        {notIn.map(s=><div key={s.id} onClick={()=>setSel(v=>v.includes(s.id)?v.filter(x=>x!==s.id):[...v,s.id])} style={{display:"flex",gap:10,alignItems:"center",padding:"9px 11px",borderRadius:10,marginBottom:5,cursor:"pointer",background:sel.includes(s.id)?"rgba(255,184,0,.15)":"rgba(255,255,255,.02)"}}>
          <div style={{width:22,height:22,borderRadius:6,border:"2px solid "+(sel.includes(s.id)?"#FFB800":"rgba(0,0,0,.2)"),background:sel.includes(s.id)?"#FFB800":"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:12,flexShrink:0}}>{sel.includes(s.id)?"✓":""}</div>
          <span style={{fontSize:20}}>{s.avatar}</span>
          <div><div style={{fontWeight:700,fontSize:13,color:tc}}>{s.name}</div><div style={{fontSize:11,color:sc}}>@{s.username} · {s.feesPaid?"已缴费":"未缴费"}</div></div>
        </div>)}
      </div>
      <div style={{padding:"12px 16px",borderTop:"1px solid "+(dk?"rgba(255,255,255,.05)":"rgba(0,0,0,.06)"),display:"flex",gap:8,justifyContent:"flex-end"}}>
        <Btn v="ghost" onClick={onClose}>取消</Btn>
        <Btn onClick={doAdd} disabled={!sel.length}>加入 {sel.length>0?"("+sel.length+")":""}</Btn>
      </div>
    </div>
  </div>;
}



function ClassBadgesPanel({classId,show}){
  const {theme,data,setData}=useApp();
  const dk=theme==="dark"; const tc=dk?"#f1f5f9":"#0f172a"; const sc=dk?"#64748b":"#94a3b8";
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({name:"",desc:"",icon:"🏆",points:30});
  const [awardM,setAwardM]=useState(null);
  const [cfDel,setCfDel]=useState(null);
  const [cfAward,setCfAward]=useState(null);
  const cls=data.classes.find(cl=>cl.id===classId);
  const badges=data.badges.filter(b=>b.classId===classId);
  const enrolled=data.users.filter(u=>u.role==="student"&&(u.enrolledClasses||[]).includes(classId));
  const save=()=>{
    if(!form.name.trim())return;
    const nd={...data};
    if(modal==="add")nd.badges=[...data.badges,{id:gid(),name:form.name.trim(),desc:form.desc.trim(),icon:form.icon||"🏆",points:parseInt(form.points)||0,classId}];
    else nd.badges=data.badges.map(b=>b.id===modal?{...b,name:form.name.trim(),desc:form.desc.trim(),icon:form.icon||"🏆",points:parseInt(form.points)||0}:b);
    setData(nd);setModal(null);show("已保存");
  };
  const doAward=()=>{
    const {sId,bId,has}=cfAward;
    if(has)setData({...data,studentBadges:data.studentBadges.filter(sb=>!(sb.studentId===sId&&sb.badgeId===bId))});
    else setData({...data,studentBadges:[...data.studentBadges,{studentId:sId,badgeId:bId,earnedAt:Date.now()}]});
    show(has?"已收回":"已颁发");setCfAward(null);setAwardM(null);
  };
  const ICONS=["🏆","⭐","🌟","🎯","📚","🔥","💎","🎖","🥇","🥈","🥉","🎁","🚀","✨","💡","🎓","🦁","🐯","🦋","💪","🧠","🎨","🎵","🌈"];
  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div>
          <div style={{fontWeight:800,fontSize:15,color:tc}}>班级徽章</div>
          <div style={{fontSize:12,color:sc,marginTop:2}}>仅属于「{cls&&cls.name}」</div>
        </div>
        <Btn v="primary" size="sm" onClick={()=>{setForm({name:"",desc:"",icon:"🏆",points:30});setModal("add");}}>+ 创建徽章</Btn>
      </div>
      {badges.length===0&&<div style={{textAlign:"center",padding:"32px 20px",color:sc,background:dk?"rgba(255,255,255,.03)":"rgba(0,0,0,.02)",borderRadius:14,border:"2px dashed "+(dk?"rgba(255,255,255,.08)":"rgba(0,0,0,.08)")}}>
        <div style={{fontSize:36,marginBottom:8}}>🏅</div>
        <div style={{fontSize:13}}>暂无徽章，点击「创建徽章」开始</div>
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:12}}>
        {badges.map(b=>{
          const cnt=data.studentBadges.filter(sb=>sb.badgeId===b.id).length;
          return (
            <Card key={b.id} style={{padding:16,textAlign:"center"}}>
              <div style={{fontSize:38,marginBottom:8}}>{b.icon}</div>
              <div style={{fontWeight:800,fontSize:14,color:tc,marginBottom:4}}>{b.name}</div>
              {b.desc&&<div style={{fontSize:11,color:sc,lineHeight:1.5,marginBottom:6}}>{b.desc}</div>}
              <Pill color="amber">⭐ {b.points} 分</Pill>
              <div style={{fontSize:11,color:sc,marginTop:5}}>{cnt}/{enrolled.length} 已获得</div>
              <div style={{display:"flex",gap:5,justifyContent:"center",marginTop:10}}>
                <Btn v="success" size="sm" onClick={()=>setAwardM(b)}>颁发</Btn>
                <Btn v="soft" size="sm" onClick={()=>{setForm({name:b.name,desc:b.desc||"",icon:b.icon,points:String(b.points)});setModal(b.id);}}>✎</Btn>
                <Btn v="danger" size="sm" onClick={()=>setCfDel(b.id)}>🗑</Btn>
              </div>
            </Card>
          );
        })}
      </div>
      <Modal open={!!modal} title={modal==="add"?"创建班级徽章":"编辑徽章"} onClose={()=>setModal(null)}>
        <Inp label="徽章标题 Title *" value={form.name} onChange={v=>setForm(f=>({...f,name:v}))} placeholder="例：数学达人"/>
        <Txt label="描述 Description" value={form.desc} onChange={v=>setForm(f=>({...f,desc:v}))} rows={2} placeholder="描述此徽章的获得条件..."/>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,marginBottom:10,textTransform:"uppercase",letterSpacing:.5,color:sc}}>图标 Icon</div>
          <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:8}}>

function TStudents({show}){

  const sts=data.users.filter(u=>u.role==="student").filter(s=>{

    }else{

    }
    setData(nd);setModal(null);show("已保存");
  };
  const adjPts=()=>{

        <Btn onClick={()=>{setForm({name:"",username:"",password:"",feesPaid:false,enrolledClasses:[],avatar:"🧑‍🎓",bio:"",points:0});setModal("add");}}>新增学员</Btn>
      </div>
      <Card style={{padding:"14px 16px",marginBottom:16}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 搜索姓名 / 账号..."

        <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
          {chip(fFee==="all","全部",()=>setFFee("all"))}
          {chip(fFee==="paid","✅ 已缴费",()=>setFFee("paid"))}
          {chip(fFee==="unpaid","❌ 未缴费",()=>setFFee("unpaid"))}
          <span style={{color:sc,fontSize:12,alignSelf:"center",margin:"0 2px"}}>|</span>
          {chip(fCls==="all","所有班级",()=>setFCls("all"))}
          {data.classes.map(cls2=>chip(fCls===cls2.id,cls2.name,()=>setFCls(cls2.id)))}
        </div>
      </Card>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {sts.map(s=>{
          const clsList=data.classes.filter(cl2=>(s.enrolledClasses||[]).includes(cl2.id));
          const monthlyFee=clsList.reduce((sum,cl2)=>sum+(cl2.monthlyFee||0),0);
          const toggleFee=()=>{setData({...data,users:data.users.map(u=>u.id===s.id?{...u,feesPaid:!s.feesPaid}:u)});show(s.feesPaid?"已标记未缴费":"已标记已缴费");};
          return (
            <Card key={s.id} style={{padding:"12px 16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>

                  <div style={{width:46,height:46,borderRadius:14,background:"linear-gradient(135deg,#FFB800,#FF8C00)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>{s.avatar}</div>
                  <div>

                    <div style={{fontSize:12,color:sc}}>@{s.username}</div>
                    <div style={{display:"flex",gap:8,marginTop:2,alignItems:"center"}}>
                      <span style={{fontSize:12,color:"#FFB800",fontWeight:600}}>⭐ {s.points||0}</span>
                      {monthlyFee>0&&<span style={{fontSize:11,color:sc}}>¥{monthlyFee}/月</span>}

                    {s.feesPaid?"✅ 已缴费":"❌ 未缴费"}
                  </button>
                  <Btn v="soft" size="sm" onClick={()=>setPtM(s)}>± 积分</Btn>
                  <Btn v="soft" size="sm" onClick={()=>{setForm({name:s.name,username:s.username,password:s.password,feesPaid:s.feesPaid,enrolledClasses:s.enrolledClasses||[],avatar:s.avatar||"🧑‍🎓",bio:s.bio||"",points:s.points||0});setModal(s.id);}}>✎</Btn>
                  <Btn v="danger" size="sm" onClick={()=>setCfDel(s.id)}>🗑</Btn>
                </div>
              </div>
              {clsList.length>0&&<div style={{marginTop:8,display:"flex",gap:5,flexWrap:"wrap"}}>{clsList.map(cl2=><Pill key={cl2.id} color="blue">{cl2.name}</Pill>)}</div>}
            </Card>
          );
        })}
        {sts.length===0&&<p style={{color:sc,textAlign:"center",padding:"32px 0"}}>没有符合条件的学员</p>}
      </div>
      <Modal open={!!modal} title={modal==="add"?"新增学员":"编辑学员"} onClose={()=>setModal(null)} wide>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 16px"}}>
          <Inp label="姓名 *" value={form.name} onChange={v=>setForm(f=>({...f,name:v}))}/>
          <Inp label="账号 *" value={form.username} onChange={v=>setForm(f=>({...f,username:v}))}/>
          <Inp label="密码 *" value={form.password} onChange={v=>setForm(f=>({...f,password:v}))}/>
          <Inp label="积分" type="number" value={String(form.points)} onChange={v=>setForm(f=>({...f,points:v}))}/>
        </div>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,marginBottom:8,textTransform:"uppercase",letterSpacing:.5,color:sc}}>头像</div>
          <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>{AVATARS.map(av=><button key={av} onClick={()=>setForm(f=>({...f,avatar:av}))} style={{fontSize:22,padding:"5px",borderRadius:8,border:"2px solid "+(form.avatar===av?"#FFB800":"transparent"),background:form.avatar===av?"rgba(255,184,0,.12)":"transparent",cursor:"pointer"}}>{av}</button>)}</div>
        </div>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,marginBottom:8,textTransform:"uppercase",letterSpacing:.5,color:sc}}>报名班级</div>
          <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>{data.classes.map(cls2=>{const checked=(form.enrolledClasses||[]).includes(cls2.id);return <button key={cls2.id} onClick={()=>setForm(f=>({...f,enrolledClasses:checked?(f.enrolledClasses||[]).filter(x=>x!==cls2.id):[...(f.enrolledClasses||[]),cls2.id]}))} style={{padding:"6px 12px",borderRadius:8,border:"1.5px solid "+(checked?"#FFB800":"rgba(0,0,0,.15)"),background:checked?"rgba(255,184,0,.15)":"transparent",color:checked?"#FFB800":sc,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit"}}>{cls2.name}</button>;})}</div>
        </div>
        <div style={{marginBottom:14,display:"flex",alignItems:"center",gap:10}}>
          <input type="checkbox" id="feeChk" checked={form.feesPaid} onChange={e=>setForm(f=>({...f,feesPaid:e.target.checked}))} style={{width:18,height:18,cursor:"pointer"}}/>
          <label htmlFor="feeChk" style={{fontSize:13,color:tc,cursor:"pointer"}}>已缴费</label>

        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><Btn v="ghost" onClick={()=>setModal(null)}>取消</Btn><Btn onClick={save}>保存</Btn></div>
      </Modal>
      <Modal open={!!ptM} title={"调整积分："+((ptM&&ptM.name)||"")} onClose={()=>setPtM(null)}>
        <Inp label="金额 (正数加分，负数扣分)" type="number" value={ptAmt} onChange={setPtAmt} placeholder="+10 or -5"/>
        <Inp label="原因" value={ptR} onChange={setPtR} placeholder="教师奖励..."/>
        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><Btn v="ghost" onClick={()=>setPtM(null)}>取消</Btn><Btn onClick={adjPts}>确认</Btn></div>

function SClassroom({classId,user,onBack,show}){
  const {theme,lang,data,setData}=useApp();

    const fileInputRef=useRef(null);
  const cls=data.classes.find(cl=>cl.id===classId);

  useEffect(()=>{
    if(cls&&cls.classLink&&cls.linkUpdatedAt){
      const key=user.id+"_"+classId;
      const seen=data.linkSeenAt||{};
      if(!seen[key]||seen[key]<cls.linkUpdatedAt){
        setData({...data,linkSeenAt:{...seen,[key]:Date.now()}});
      }
    }
  },[]);

  if(!cls)return null;

  const pal=palOf(cls,data.classes.indexOf(cls));
  const feed=data.posts.filter(p=>p.classId===classId&&p.type!=="forum").sort((a,b)=>b.createdAt-a.createdAt);
  const forum=data.posts.filter(p=>p.classId===classId&&p.type==="forum").sort((a,b)=>b.createdAt-a.createdAt);

  const submit=()=>{
    if(!pf.content.trim()&&!pf.images.length)return;
    setData({...data,posts:[...data.posts,{id:gid(),classId,type:"forum",title:pf.title.trim()||pf.content.slice(0,40)||"Post",content:pf.content,images:pf.images||[],authorId:user.id,createdAt:Date.now(),likes:[],url:"",fileData:null,fileName:"",materialType:""}]});
    setPf({title:"",content:"",images:[]});setModal(false);show(L?"Posted!":"发布成功");
  };

  const handleImgs=async(files)=>{
    if(!files||!files.length)return;
    const avail=5-(pf.images.length);
    if(avail<=0){show(L?"Max 5 images":"最多5张图片","warn");return;}
    setImgLoading(true);
    const imgs=[];
    for(const f of Array.from(files).slice(0,avail)){
      try{imgs.push(await resizeImg(f));}catch{}
    }
    setPf(prev=>({...prev,images:[...prev.images,...imgs]}));
    setImgLoading(false);

          <Ico n="back" size={14} color="#fff"/><span>{L?"Back":"返回"}</span>
        </button>
        <div style={{flex:1}}>
          <div style={{fontWeight:800,fontSize:16,color:"#fff"}}>{cls.name}</div>
          {cls.desc&&<div style={{fontSize:12,color:"rgba(255,255,255,.75)"}}>{cls.desc}</div>}
        </div>
      </div>

      {/* Live class banner */}

      {/* Join meeting button */}
      <div style={{padding:"8px 16px 4px",display:"flex",justifyContent:"flex-end"}}>
        <button onClick={()=>setPreMeet(true)} style={{display:"flex",alignItems:"center",gap:7,padding:"7px 16px",borderRadius:50,border:"1.5px solid rgba(255,184,0,.4)",background:"rgba(255,184,0,.1)",color:"#FFB800",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
          <Ico n="classes" size={14} color="#FFB800"/><span>{L?"Join Meeting":"加入视频课堂"}</span>
        </button>
      </div>

      {/* Class link */}

        <div style={{padding:"10px 16px",background:dk?"rgba(255,184,0,.1)":"rgba(99,102,241,.05)",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>

          </div>
          <Btn v="primary" size="sm" onClick={()=>window.open(cls.classLink,"_blank")}>{L?"Open":"打开"}</Btn>
        </div>
      )}

      {/* Tabs */}
      <div style={{display:"flex",borderBottom:"1px solid "+(dk?"rgba(255,255,255,.06)":"rgba(0,0,0,.06)"),overflowX:"auto"}}>

              <Ico n="plus" size={16} color="#FFB800"/>
              <span>{L?"New Post":"发帖"}</span>
            </button>
            {forum.length===0&&<p style={{color:sc,textAlign:"center",padding:"36px 0",fontSize:13}}>{L?"No posts yet":"暂无帖子"}</p>}
            {forum.map(post=><PostCard key={post.id} post={post} userId={user.id} onDelete={null} show={show}/>)}
          </div>
        )}
      </div>

      {/* Post modal — NO link input, image upload via button ref */}

        <Txt label={L?"Content *":"内容 *"} value={pf.content} onChange={v=>setPf(f=>({...f,content:v}))} rows={4} placeholder={L?"Share your thoughts...":"分享你的想法..."}/>

        {/* Images — button triggers ref click directly */}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:700,marginBottom:8,textTransform:"uppercase",letterSpacing:.5,color:sc}}>
            {L?"Images (optional, max 5)":"图片（选填，最多5张）"}
          </div>

          {/* Hidden real file input */}
          <input
            ref={fileInputRef}
            type="file"
            accept="image/*"
            multiple
            style={{display:"none"}}
            onChange={e=>{handleImgs(e.target.files);}}
          />

          {/* Visible button — calls ref.click() directly */}
          <button
            type="button"
            onClick={pickImages}
            disabled={imgLoading}
            style={{display:"inline-flex",alignItems:"center",gap:8,padding:"9px 16px",borderRadius:10,border:"1.5px dashed rgba(99,102,241,.5)",background:imgLoading?"rgba(255,184,0,.06)":"rgba(255,184,0,.1)",cursor:imgLoading?"not-allowed":"pointer",fontSize:13,color:imgLoading?"#94a3b8":"#FFB800",fontWeight:600,fontFamily:"inherit",transition:"all .15s"}}>
            <Ico n="image" size={16} color={imgLoading?"#94a3b8":"#FFB800"}/>
            <span>{imgLoading?(L?"Processing...":"处理中..."):(L?"Add Images":"添加图片")} ({pf.images.length}/5)</span>
          </button>

          {pf.images.length>0&&(
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:10}}>
              {pf.images.map((img,i)=>(
                <div key={i} style={{position:"relative",width:68,height:68}}>
                  <img src={img} style={{width:68,height:68,objectFit:"cover",borderRadius:10,display:"block"}}/>
                  <button onClick={()=>setPf(f=>({...f,images:f.images.filter((_,j)=>j!==i)}))}
                    style={{position:"absolute",top:-6,right:-6,background:"#ef4444",border:"2px solid #fff",color:"#fff",width:20,height:20,borderRadius:"50%",cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
                </div>
              ))}
            </div>
          )}
        </div>

        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>setModal(false)}>{L?"Cancel":"取消"}</Btn>
          <Btn onClick={submit}>{L?"Post":"发布"}</Btn>
        </div>
      </Modal>

    </div>
  );
}

function SAI({user,myClasses,show}){
  const {theme,lang,data,setData}=useApp();
  const dk=theme==="dark"; const tc=dk?"#f1f5f9":"#0f172a"; const sc=dk?"#64748b":"#94a3b8";
  const L=lang==="en";
  const [msgs,setMsgs]=useState([{id:"sys0",role:"assistant",content:L?"Hi! I'm your AI tutor 👋 Ask me anything, or upload a photo to analyze!":"你好！我是你的AI学习助手 👋 问我任何问题，也可以上传图片让我解析！",time:Date.now()}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [selC,setSelC]=useState((myClasses[0]&&myClasses[0].id)||"");
  const [showSaved,setShowSaved]=useState(false);
  const [imgData,setImgData]=useState(null);
  const [imgPreview,setImgPreview]=useState(null);
  const [apiKeyInput,setApiKeyInput]=useState(()=>localStorage.getItem("th_aikey")||"");
  const [showKeyInput,setShowKeyInput]=useState(false);
  const ref=useRef(null);
  const td=toDay();

  useEffect(()=>{if(ref.current)ref.current.scrollTop=ref.current.scrollHeight;},[msgs]);

  const getSaved=()=>JSON.parse(localStorage.getItem("th_saved_"+user.id)||"[]");

  const saveMsg=(msg)=>{
    const existing=getSaved();
    if(existing.find(m=>m.id===msg.id)){
      localStorage.setItem("th_saved_"+user.id,JSON.stringify(existing.filter(m=>m.id!==msg.id)));
      show(L?"Removed from saved":"已取消收藏","warn");
    }else{
      localStorage.setItem("th_saved_"+user.id,JSON.stringify([...existing,{...msg,savedAt:Date.now()}]));
      show(L?"Saved!":"已收藏");
    }
    setMsgs(m=>[...m]);
  };

  const isSaved=(id)=>getSaved().some(m=>m.id===id);

  const handleImg=(file)=>{
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const b64=ev.target.result.split(",")[1];
      setImgData({b64,type:file.type||"image/jpeg"});
      setImgPreview(ev.target.result);
    };
    reader.readAsDataURL(file);
  };

  const send=async()=>{
    if((!input.trim()&&!imgData)||loading)return;
    const userMsg={id:gid(),role:"user",content:input.trim()||(imgData?"(Photo attached)":""),img:imgPreview,time:Date.now()};
    const newMsgs=[...msgs,userMsg];
    setMsgs(newMsgs); setInput(""); const savedImg=imgData; setImgData(null); setImgPreview(null); setLoading(true);

    const done=(data.dailyAIQ||[]).some(d=>d.studentId===user.id&&d.date===td);
    if(!done){const pts=data.aiPts||15;setData({...data,dailyAIQ:[...(data.dailyAIQ||[]),{studentId:user.id,date:td}],users:data.users.map(u=>u.id===user.id?{...u,points:(u.points||0)+pts}:u),pointTransactions:[...data.pointTransactions,{id:gid(),studentId:user.id,amount:pts,reason:L?"Daily AI":"每日AI提问",timestamp:Date.now()}]});show("+"+pts+" pts");}

    const apiKey=localStorage.getItem("th_aikey")||"";
    const cn=(myClasses.find(cl=>cl.id===selC)||{name:"general"}).name;
    const sysPrompt=L?"You are an encouraging bilingual AI tutor. Student class: \""+cn+"\". Be concise and supportive. If given an image, analyze it and help the student understand.":"你是一位鼓励学生的双语AI学习助手。学生班级：「"+cn+"」。回答简洁、积极。如果收到图片，请帮助学生理解图片内容。";

    const apiMsgs=newMsgs.filter(m=>m.role==="user"||m.role==="assistant").slice(-8).map(m=>{
      if(m.role==="user"&&m.img&&m.img.includes("base64,")){
        const b64=m.img.split(",")[1];
        const mtype=m.img.startsWith("data:image/png")?"image/png":"image/jpeg";
        return {role:"user",content:[{type:"image",source:{type:"base64",media_type:mtype,data:b64}},{type:"text",text:m.content||"What is in this image?"}]};
      }
      return {role:m.role,content:typeof m.content==="string"?m.content:"(content)"};
    });

    try{
      let reply="";
      if(apiKey){
        const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-opus-4-5",max_tokens:1024,system:sysPrompt,messages:apiMsgs})});
        if(!resp.ok){const e=await resp.json();throw new Error(e.error&&e.error.message||"API error "+resp.status);}
        const d=await resp.json();
        reply=d.content&&d.content[0]&&d.content[0].text||"(no response)";
      }else{
        const textMsgs=apiMsgs.map(m=>({role:m.role,content:typeof m.content==="string"?m.content:((Array.isArray(m.content)?m.content.find(x=>x.type==="text"):null)||{text:"(image)"}).text}));
        const resp=await fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"openai-large",messages:[{role:"system",content:sysPrompt},...textMsgs],seed:42})});
        if(!resp.ok)throw new Error("HTTP "+resp.status);
        const d=await resp.json();
        reply=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"(no response)";
      }
      setMsgs([...newMsgs,{id:gid(),role:"assistant",content:reply,time:Date.now()}]);
    }catch(e){
      setMsgs([...newMsgs,{id:gid(),role:"assistant",content:"❌ "+(e.message||"Error")+(apiKey?"\n\n请检查API Key是否正确。":""),time:Date.now()}]);
    }
    setLoading(false);
  };

  const savedList=getSaved();

  return (
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 64px)",minHeight:360,background:"inherit"}}>
      {/* Top bar */}
      <div style={{padding:"10px 14px",borderBottom:"1px solid "+(dk?"rgba(255,255,255,.06)":"rgba(0,0,0,.06)"),display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",background:dk?"#111827":"#fff"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:32,height:32,borderRadius:10,background:"linear-gradient(135deg,#FFB800,#FF8C00)",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico n="ai" size={16} color="#fff"/></div>
          <div>
            <div style={{fontWeight:700,fontSize:14,color:dk?"#f1f5f9":"#0f172a"}}>{L?"AI Tutor":"AI 助手"}</div>
            <div style={{fontSize:10,color:sc}}>{localStorage.getItem("th_aikey")?"✅ Claude API":"Pollinations AI · Free"}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          {myClasses.length>0&&<select value={selC} onChange={e=>setSelC(e.target.value)} style={{padding:"5px 9px",borderRadius:8,border:"1.5px solid "+(dk?"rgba(255,255,255,.1)":"rgba(0,0,0,.1)"),background:dk?"#1e293b":"#fff",color:dk?"#f1f5f9":"#0f172a",fontSize:12,outline:"none",cursor:"pointer",fontFamily:"inherit"}}>{myClasses.map(cl=><option key={cl.id} value={cl.id}>{cl.name}</option>)}</select>}
          <button onClick={()=>setShowSaved(v=>!v)} style={{display:"flex",alignItems:"center",gap:5,padding:"5px 10px",borderRadius:8,border:"1.5px solid "+(showSaved?"#FFB800":"rgba(0,0,0,.1)"),background:showSaved?"rgba(255,184,0,.12)":"transparent",color:showSaved?"#FFB800":sc,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
            <Ico n="savebookmark" size={13} color={showSaved?"#FFB800":sc}/><span>{savedList.length}</span>
          </button>
          <button onClick={()=>setShowKeyInput(v=>!v)} style={{display:"flex",alignItems:"center",gap:5,padding:"5px 10px",borderRadius:8,border:"1.5px solid rgba(0,0,0,.1)",background:"transparent",color:sc,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
            <Ico n="unlock" size={13} color={localStorage.getItem("th_aikey")?"#22c55e":sc}/><span>API Key</span>
          </button>
        </div>
      </div>

      {/* API Key input */}
      {showKeyInput&&(
        <div style={{padding:"10px 14px",borderBottom:"1px solid "+(dk?"rgba(255,255,255,.05)":"rgba(0,0,0,.06)"),background:dk?"rgba(255,184,0,.08)":"rgba(99,102,241,.03)"}}>
          <div style={{fontSize:11,color:sc,marginBottom:6}}>Anthropic API Key → 使用 Claude（支持图片识别）/ Claude API with vision support</div>
          <div style={{display:"flex",gap:7}}>
            <input value={apiKeyInput} onChange={e=>setApiKeyInput(e.target.value)} type="password" placeholder="sk-ant-api03-..."
              style={{flex:1,padding:"8px 11px",borderRadius:9,border:"1.5px solid "+(dk?"rgba(255,255,255,.1)":"rgba(0,0,0,.1)"),background:dk?"rgba(255,255,255,.05)":"#fff",color:dk?"#f1f5f9":"#0f172a",fontSize:12,outline:"none",fontFamily:"inherit"}}/>
            <Btn v="primary" size="sm" onClick={()=>{localStorage.setItem("th_aikey",apiKeyInput.trim());setShowKeyInput(false);show(apiKeyInput.trim()?"API Key 已保存":"已清除");}}>Save</Btn>
            {localStorage.getItem("th_aikey")&&<Btn v="danger" size="sm" onClick={()=>{localStorage.removeItem("th_aikey");setApiKeyInput("");show("Cleared","warn");}}>×</Btn>}
          </div>
        </div>
      )}

      {/* Saved messages panel */}
      {showSaved&&(
        <div style={{padding:"10px 14px",borderBottom:"1px solid "+(dk?"rgba(255,255,255,.05)":"rgba(0,0,0,.06)"),maxHeight:180,overflowY:"auto",background:dk?"rgba(255,255,255,.02)":"rgba(0,0,0,.01)"}}>
          <div style={{fontSize:11,fontWeight:700,color:sc,marginBottom:8,textTransform:"uppercase",letterSpacing:.5}}>{L?"Saved":"已收藏"} ({savedList.length})</div>
          {savedList.length===0&&<p style={{color:sc,fontSize:12}}>No saved messages yet</p>}
          {savedList.map(m=>(
            <div key={m.id} style={{background:dk?"rgba(255,255,255,.04)":"rgba(0,0,0,.03)",borderRadius:9,padding:"8px 10px",marginBottom:6,position:"relative"}}>
              <div style={{fontSize:12,color:dk?"#cbd5e1":"#374151",lineHeight:1.5,paddingRight:20}}>{m.content.slice(0,150)}{m.content.length>150?"...":""}</div>
              <button onClick={()=>{saveMsg(m);setShowSaved(true);}} style={{position:"absolute",top:6,right:6,background:"none",border:"none",cursor:"pointer"}}><Ico n="close" size={12} color="#ef4444"/></button>
            </div>
          ))}
        </div>
      )}

      {/* Messages */}
      <div ref={ref} style={{flex:1,overflowY:"auto",padding:"12px 14px",display:"flex",flexDirection:"column",gap:10}}>
        {msgs.map(m=>(
          <div key={m.id} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",alignItems:"flex-end",gap:8}}>
            {m.role==="assistant"&&<div style={{width:30,height:30,borderRadius:10,background:"linear-gradient(135deg,#FFB800,#FF8C00)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Ico n="ai" size={15} color="#fff"/></div>}
            <div style={{maxWidth:"78%",position:"relative"}}>
              {m.img&&<img src={m.img} style={{maxWidth:"100%",maxHeight:160,borderRadius:"12px 12px 0 0",display:"block",objectFit:"cover"}}/>}
              <div style={{padding:"11px 14px",borderRadius:m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px",background:m.role==="user"?"linear-gradient(135deg,#FFB800,#FF8C00)":dk?"#1a2035":"#f1f5f9",color:m.role==="user"?"#fff":dk?"#e2e8f0":"#1e293b",fontSize:13,lineHeight:1.7,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>
                {m.content}
              </div>
              {m.role==="assistant"&&(
                <button onClick={()=>saveMsg(m)} title={isSaved(m.id)?"Remove bookmark":"Save"}
                  style={{position:"absolute",bottom:-2,right:4,background:dk?"#1e293b":"#fff",border:"1px solid "+(dk?"rgba(255,255,255,.1)":"rgba(0,0,0,.08)"),borderRadius:"50%",width:24,height:24,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 1px 4px rgba(0,0,0,.12)"}}>
                  <Ico n="savebookmark" size={12} color={isSaved(m.id)?"#FFB800":sc}/>

            <div style={{padding:"12px 16px",borderRadius:"16px 16px 16px 4px",background:dk?"#1a2035":"#f1f5f9",display:"flex",gap:5,alignItems:"center"}}>

      {/* Image preview */}
      {imgPreview&&(

          <img src={imgPreview} style={{height:48,width:48,objectFit:"cover",borderRadius:8,display:"block"}}/>

        </div>
      )}

      {/* Input bar */}
      <div style={{padding:"10px 12px",display:"flex",gap:7,borderTop:"1px solid "+(dk?"rgba(255,255,255,.06)":"rgba(0,0,0,.06)"),alignItems:"flex-end",background:dk?"#111827":"#fff"}}>
        {/* Camera button (mobile: capture photo; desktop: open file) */}
        <React.Fragment>
          <input type="file" accept="image/*" capture="environment" id="ai-cam" style={{display:"none"}} onChange={e=>{if(e.target.files[0]){handleImg(e.target.files[0]);}e.target.value="";}}/>
          <label htmlFor="ai-cam" title="Take photo / 拍照">
            <div style={{width:40,height:40,borderRadius:12,border:"1.5px solid "+(dk?"rgba(255,255,255,.1)":"rgba(0,0,0,.1)"),background:dk?"rgba(255,255,255,.05)":"rgba(0,0,0,.02)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}>
              <Ico n="camera" size={18} color="#FFB800"/>
            </div>
          </label>
        </React.Fragment>
        {/* Gallery button */}
        <React.Fragment>
          <input type="file" accept="image/*" id="ai-gal" style={{display:"none"}} onChange={e=>{if(e.target.files[0]){handleImg(e.target.files[0]);}e.target.value="";}}/>
          <label htmlFor="ai-gal" title="Upload image / 上传图片">
            <div style={{width:40,height:40,borderRadius:12,border:"1.5px solid "+(dk?"rgba(255,255,255,.1)":"rgba(0,0,0,.1)"),background:dk?"rgba(255,255,255,.05)":"rgba(0,0,0,.02)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}>
              <Ico n="image" size={18} color="#E5A500"/>
            </div>
          </label>
        </React.Fragment>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&(e.preventDefault(),send())}
          placeholder={L?"Ask anything...":"向AI提问..."}
          style={{flex:1,padding:"11px 16px",borderRadius:50,border:"1.5px solid "+(dk?"rgba(255,255,255,.1)":"rgba(0,0,0,.1)"),background:dk?"rgba(255,255,255,.05)":"rgba(0,0,0,.02)",color:dk?"#f1f5f9":"#0f172a",fontSize:13,outline:"none",fontFamily:"inherit"}}/>
        <button onClick={send} disabled={loading||(!input.trim()&&!imgData)}
          style={{width:42,height:42,borderRadius:14,border:"none",background:loading||(!input.trim()&&!imgData)?"rgba(99,102,241,.25)":"linear-gradient(135deg,#FFB800,#FF8C00)",display:"flex",alignItems:"center",justifyContent:"center",cursor:loading||(!input.trim()&&!imgData)?"not-allowed":"pointer",flexShrink:0}}>
          <Ico n="send" size={18} color="#fff"/>
        </button>
      </div>
    </div>
  );
}

function SHome({cu,myClasses,onEnterClass,show,isMob}){
  const {theme,lang,data}=useApp();
  const dk=theme==="dark";
  const tc=dk?"#f1f5f9":"#0f172a";
  const sc=dk?"#64748b":"#94a3b8";
  const L=lang==="en";
  const myBadgeIds=data.studentBadges.filter(function(sb){return sb.studentId===cu.id;}).map(function(sb){return sb.badgeId;});
  const myBadges=data.badges.filter(function(b){return myBadgeIds.includes(b.id);}).slice(0,6);
  const now=new Date();
  const yr=now.getFullYear();
  const mo=now.getMonth();
  const firstDay=new Date(yr,mo,1).getDay();
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const todayDate=now.getDate();
  const moStr=String(mo+1).padStart(2,"0");
  const checkedDays=new Set(
    (data.dailyCheckins||[])
      .filter(function(d){return d.studentId===cu.id&&d.date.startsWith(yr+"-"+moStr);})
      .map(function(d){return parseInt(d.date.slice(-2));})
  );
  const monthName=L?now.toLocaleString("en",{month:"long"}):["一","二","三","四","五","六","七","八","九","十","十一","十二"][mo]+"月";
  const weekLabels=L?["Su","Mo","Tu","We","Th","Fr","Sa"]:["日","一","二","三","四","五","六"];
  return (
    <div style={{padding:"14px 14px 0"}}>
      <div style={{background:"linear-gradient(135deg,#FFB800,#FF8C00)",borderRadius:20,padding:"20px",marginBottom:14,position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:-20,right:-20,width:100,height:100,borderRadius:"50%",background:"rgba(255,255,255,.07)"}}/>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16,position:"relative"}}>
          <div style={{width:50,height:50,borderRadius:15,background:"rgba(255,255,255,.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:800,color:"#fff",border:"2px solid rgba(255,255,255,.3)"}}>{cu.avatar}</div>
          <div>
            <div style={{fontWeight:800,fontSize:17,color:"#fff"}}>{L?"Hello, ":"你好，"}{cu.name}！</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,.7)",marginTop:2}}>{L?"Keep it up!":"继续加油 💪"}</div>
          </div>
        </div>
        <div style={{display:"flex"}}>
          {[{n:"lightning",v:cu.points||0,l:L?"Points":"积分"},{n:"classes",v:myClasses.length,l:L?"Classes":"班级"},{n:"award",v:myBadges.length,l:L?"Badges":"徽章"},{n:"check",v:checkedDays.size,l:L?"Days":"签到"}].map(function(st,i){
            return (
              <div key={st.l} style={{flex:1,textAlign:"center",borderLeft:i>0?"1px solid rgba(255,255,255,.15)":"none"}}>
                <div style={{display:"flex",justifyContent:"center",marginBottom:2}}><Ico n={st.n} size={13} color="rgba(255,255,255,.7)"/></div>
                <div style={{fontSize:20,fontWeight:800,color:"#fff"}}>{st.v}</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,.6)"}}>{st.l}</div>
              </div>
            );
          })}
        </div>
      </div>

      <div style={{background:dk?"#1e293b":"#fff",borderRadius:16,padding:"14px 16px",marginBottom:14,boxShadow:dk?"0 2px 12px rgba(0,0,0,.2)":"0 2px 10px rgba(0,0,0,.05)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{display:"flex",alignItems:"center",gap:7}}>
            <Ico n="calendar" size={15} color="#FFB800"/>
            <span style={{fontWeight:700,fontSize:14,color:tc}}>{monthName} {yr}</span>
          </div>
          <span style={{fontSize:12,color:"#FFB800",fontWeight:600}}>{checkedDays.size} {L?"days":"天"}</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:4}}>
          {weekLabels.map(function(d){return <div key={d} style={{textAlign:"center",fontSize:10,color:sc,fontWeight:600,padding:"2px 0"}}>{d}</div>;})}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
          {Array.from({length:firstDay}).map(function(_,i){return <div key={"e"+i}/>;})}
          {Array.from({length:daysInMonth}).map(function(_,i){
            const day=i+1;
            const isToday=day===todayDate;
            const checked=checkedDays.has(day);
            const isPast=day<todayDate;
            return (
              <div key={day} style={{aspectRatio:"1",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:checked||isToday?700:400,background:checked?"linear-gradient(135deg,#FFB800,#FF8C00)":isToday?"rgba(255,184,0,.15)":"transparent",color:checked?"#fff":isToday?"#FFB800":isPast?sc:tc,border:isToday&&!checked?"1.5px solid rgba(255,184,0,.4)":"1.5px solid transparent"}}>
                {checked?<Ico n="check" size={10} color="#fff"/>:day}
              </div>
            );
          })}
        </div>
      </div>

      {myBadges.length>0&&(
        <div style={{background:dk?"#1e293b":"#fff",borderRadius:16,padding:"14px 16px",marginBottom:14,boxShadow:dk?"0 2px 12px rgba(0,0,0,.2)":"0 2px 10px rgba(0,0,0,.05)"}}>
          <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:12}}>
            <Ico n="award" size={15} color="#f59e0b"/>
            <span style={{fontWeight:700,fontSize:14,color:tc}}>{L?"My Badges":"我的徽章"}</span>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {myBadges.map(function(b){
              const earned=data.studentBadges.find(function(sb){return sb.studentId===cu.id&&sb.badgeId===b.id;});
              return (
                <div key={b.id} style={{textAlign:"center",padding:"10px 12px",borderRadius:12,background:dk?"rgba(255,255,255,.04)":"rgba(0,0,0,.02)",border:"1px solid "+(dk?"rgba(255,255,255,.06)":"rgba(0,0,0,.05)"),minWidth:60}}>
                  <div style={{fontSize:26,marginBottom:4}}>{b.icon==="star"?"⭐":b.icon==="award"?"🏆":b.icon==="fire"?"🔥":"🏅"}</div>
                  <div style={{fontSize:11,fontWeight:600,color:tc,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:56}}>{b.name}</div>
                  {earned&&<div style={{fontSize:9,color:sc,marginTop:2}}>{new Date(earned.earnedAt).toLocaleDateString()}</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
        <Ico n="classes" size={15} color="#FFB800"/>
        <span style={{fontWeight:700,fontSize:14,color:tc}}>{L?"My Classes":"我的班级"}</span>
      </div>
      {myClasses.length===0&&(
        <div style={{textAlign:"center",padding:"32px 0",color:sc}}>
          <Ico n="book" size={32} color={sc}/>
          <p style={{marginTop:12,fontSize:13}}>{L?"No classes yet":"暂无班级"}</p>
        </div>
      )}
      {myClasses.map(function(cls,i){
        const pal=palOf(cls,i);
        const postCount=data.posts.filter(function(p){return p.classId===cls.id;}).length;
        const hasNew=cls.classLink&&cls.linkUpdatedAt&&(!data.linkSeenAt||!data.linkSeenAt[cu.id+"_"+cls.id]||data.linkSeenAt[cu.id+"_"+cls.id]<cls.linkUpdatedAt);
        return (
          <div key={cls.id} style={{borderRadius:14,overflow:"hidden",marginBottom:10,boxShadow:dk?"0 4px 14px rgba(0,0,0,.25)":"0 2px 10px rgba(0,0,0,.07)",cursor:"pointer"}} onClick={function(){onEnterClass(cls.id);}}>
            <div style={{background:"linear-gradient(135deg,"+pal[0]+","+pal[1]+")",padding:"14px 16px",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontWeight:700,fontSize:14,color:"#fff"}}>{cls.name}</div>
                {cls.desc&&<div style={{fontSize:11,color:"rgba(255,255,255,.75)",marginTop:2}}>{cls.desc}</div>}
              </div>
              {hasNew&&(
                <div style={{background:"rgba(255,255,255,.25)",color:"#fff",padding:"3px 8px",borderRadius:50,fontSize:11,fontWeight:700,display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
                  <Ico n="bell" size={10} color="#fff"/>
                  <span>New</span>
                </div>
              )}
            </div>
            <div style={{background:dk?"#1e293b":"#fff",padding:"9px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{display:"flex",alignItems:"center",gap:5,color:sc}}>
                <Ico n="book" size={12} color={sc}/>
                <span style={{fontSize:12}}>{postCount} {L?"posts":"条"}</span>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:4,color:"#FFB800"}}>
                <span style={{fontSize:12,fontWeight:600}}>{L?"Enter":"进入"}</span>
                <Ico n="trending" size={12} color="#FFB800"/>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function App(){
  const [data,setDataState]=useState(function(){return loadData();});
  const [user,setUser]=useState(null);
  const [lang,setLangState]=useState(function(){try{return localStorage.getItem("th_lang")||"zh";}catch{return "zh";}});
  const [themeRaw,setThemeRaw]=useState(function(){try{return localStorage.getItem("th_theme")||"light";}catch{return "light";}});
  const setData=useCallback(function(d){setDataState(d);saveData(d);bcBcast(d);fbPush(d);},[]);
  const setLang=function(l){setLangState(l);try{localStorage.setItem("th_lang",l);}catch{}};
  const setTheme=function(v){setThemeRaw(v);try{localStorage.setItem("th_theme",v);}catch{}};
  useEffect(function(){
    if(fbUrl()){fbLoad().then(function(d){if(d&&d.users){setDataState(d);saveData(d);}});fbListen(function(d){if(d&&d.users){setDataState(d);saveData(d);}});}
    if(bc){bc.onmessage=function(e){if(e.data&&e.data.type==="data"&&e.data.d){setDataState(e.data.d);saveData(e.data.d);}};}
    var cm=curMonth();
    setDataState(function(prev){
      if(prev.lastFeeReset!==cm){var nd={...prev,users:prev.users.map(function(u){return u.role==="student"?{...u,feesPaid:false}:u;}),lastFeeReset:cm};saveData(nd);return nd;}
      return prev;
    });
    return function(){if(fbEvt){try{fbEvt.close();}catch{}}};
  },[]);
  var isDark=themeRaw==="system"?(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches):themeRaw==="dark";
  var theme=isDark?"dark":"light";
  var t={};
  var syncUser=user?data.users.find(function(u){return u.id===user.id;}):null;
  var showLocked=syncUser&&syncUser.role==="student"&&!syncUser.feesPaid;
  var showTeacher=syncUser&&syncUser.role==="teacher";
  var showStudent=syncUser&&syncUser.role==="student"&&!showLocked;
  return (
    <Ctx.Provider value={{theme:theme,setTheme:setTheme,lang:lang,setLang:setLang,t:t,data:data,setData:setData}}>
      {!user&&<LoginPage onLogin={function(u){setUser(u);}}/>}
      {showLocked&&<LockedPage user={syncUser} onLogout={function(){setUser(null);}}/>}
      {showTeacher&&<TeacherPortal user={syncUser} onLogout={function(){setUser(null);}}/>}
      {showStudent&&<StudentPortal user={syncUser} onLogout={function(){setUser(null);}}/>}
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
