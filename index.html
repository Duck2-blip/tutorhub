<!DOCTYPE html>
<html lang="zh">
<head>

    <title>TutorHub</title>
    <!-- These are the "brains" of your app -->
    <script src="https://cloudflare.com"></script>

        :root { --primary:#FFB800; --bg:#F8F5EE; }

<body>

    <div id="root"></div>

    <!-- 2. Your React code goes inside this specific script tag -->
    <script type="text/babel">
        function App() {
            return (
                <div style={{padding: '20px', textAlign: 'center'}}>
                    <h1 style={{color: '#FFB800'}}>tutorhub</h1>

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
